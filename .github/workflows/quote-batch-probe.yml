name: V10.3.8 Quote Batch Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Tencent quote batch capacity
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from zoneinfo import ZoneInfo

          # Diagnostic samples only. These 20 symbols are NOT a full-market roster.
          CODES = [
              'sh600707', 'sz002436', 'sh600000', 'sh600036', 'sh600519',
              'sh600887', 'sh601318', 'sh601398', 'sh600276', 'sh600309',
              'sh601166', 'sh601668', 'sz000001', 'sz000063', 'sz000333',
              'sz000651', 'sz000858', 'sz002415', 'sz002594', 'sz002475',
          ]
          GROUPS = [('baseline_2', CODES[:2]), ('batch_10', CODES[:10]), ('batch_20', CODES)]
          PATTERN = re.compile(r'v_((?:sh|sz)\d{6})="([^"]*)"')
          SHANGHAI = ZoneInfo('Asia/Shanghai')
          results = []

          def request(codes):
              url = 'https://qt.gtimg.cn/q=' + ','.join(codes)
              headers = {
                  'User-Agent': 'Mozilla/5.0 AShareQuant/quote-batch-probe',
                  'Referer': 'https://gu.qq.com/',
                  'Cache-Control': 'no-cache',
              }
              start = time.monotonic()
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=8) as response:
                      raw = response.read().decode('gbk', errors='replace')
                      return response.status, raw, round((time.monotonic()-start)*1000), None
              except urllib.error.HTTPError as exc:
                  return exc.code, '', round((time.monotonic()-start)*1000), 'HTTPError'
              except Exception as exc:
                  return None, '', round((time.monotonic()-start)*1000), type(exc).__name__

          def inspect(round_no, group_name, codes):
              status, raw, elapsed, transport_error = request(codes)
              pairs = PATTERN.findall(raw)
              found = {}
              duplicates = []
              invalid = []
              quote_times = []
              ages = []
              observed = dt.datetime.now(dt.timezone.utc)
              for symbol, payload in pairs:
                  if symbol in found:
                      duplicates.append(symbol)
                  fields = payload.split('~')
                  found[symbol] = fields
                  try:
                      price, previous = float(fields[3]), float(fields[4])
                      stamp = fields[30]
                      at = dt.datetime.strptime(stamp, '%Y%m%d%H%M%S').replace(tzinfo=SHANGHAI)
                      if not 0 < price < 100000 or not 0 < previous < 100000:
                          raise ValueError('nonpositive-price')
                      quote_times.append(stamp)
                      ages.append(round((observed-at.astimezone(dt.timezone.utc)).total_seconds()))
                  except (ValueError, IndexError):
                      invalid.append(symbol)
              missing = sorted(set(codes)-set(found))
              unexpected = sorted(set(found)-set(codes))
              passed = status == 200 and not transport_error and not missing and not unexpected and not duplicates and not invalid and len(found) == len(codes)
              item = {
                  'round': round_no, 'group': group_name, 'requested': len(codes),
                  'returned': len(found), 'http': status, 'elapsedMs': elapsed,
                  'missing': missing, 'unexpected': unexpected,
                  'duplicate': duplicates, 'invalid': invalid,
                  'earliestQuoteTime': min(quote_times) if quote_times else None,
                  'latestQuoteTime': max(quote_times) if quote_times else None,
                  'oldestQuoteAgeSeconds': max(ages) if ages else None,
                  'error': transport_error, 'ok': passed,
              }
              print(json.dumps(item, ensure_ascii=False), flush=True)
              return item

          for round_no in (1, 2, 3):
              for name, codes in GROUPS:
                  results.append(inspect(round_no, name, codes))
              if round_no < 3:
                  time.sleep(2)

          summary = {
              'schema': 'ashare-v1038-quote-batch-probe-v1',
              'diagnosticOnly': True, 'notFullMarketScan': True,
              'neverTradeSignal': True,
              'observedAt': dt.datetime.now(dt.timezone.utc).isoformat(),
              'successfulChecks': sum(item['ok'] for item in results),
              'totalChecks': len(results), 'results': results,
          }
          with open('quote-batch-probe-report.json', 'w', encoding='utf-8') as file:
              json.dump(summary, file, ensure_ascii=False, indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as file:
              file.write(f"## Quote batch probe: {summary['successfulChecks']}/{summary['totalChecks']} checks passed\n\n")
              file.write('Diagnostic sample only; no full-market or trade signal claims. Quote age is reported, not treated as a trading-session freshness pass.\n\n')
              file.write('| Round | Group | Requested | Returned | HTTP | Missing | Invalid | Oldest quote age (s) | ms | OK |\n')
              file.write('|---:|---|---:|---:|---:|---:|---:|---:|---:|---|\n')
              for row in results:
                  file.write(f"| {row['round']} | {row['group']} | {row['requested']} | {row['returned']} | {row['http']} | {len(row['missing'])} | {len(row['invalid'])} | {row['oldestQuoteAgeSeconds']} | {row['elapsedMs']} | {row['ok']} |\n")
          # A failed diagnostic stays visible in the report; it is not masked as success.
          if summary['successfulChecks'] != summary['totalChecks']:
              raise SystemExit('QUOTE_BATCH_DIAGNOSTIC_FAILED: see summary and artifact')
          PY
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-batch-probe-report
          path: quote-batch-probe-report.json
          if-no-files-found: warn
